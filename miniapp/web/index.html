<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Aside Mobile</title>
    <!--
      Telegram's webview bridge. Only meaningful inside Telegram; in a plain
      browser it is simply absent and the app falls back to a #initData=
      hash param (see scripts/dev-initdata.mjs). Fonts and every other asset
      are bundled locally.
    -->
    <!--
      `defer`, because without it this is a render-blocking request to a
      third-party origin sitting above everything the app needs. A classic
      script with no attribute stops the HTML parser dead: the browser will
      not even DISCOVER the module script and the stylesheet below until
      telegram.org has answered. On a phone reaching the Mac over a tailnet
      that is a DNS lookup, a TLS handshake and a round trip to a different
      network, before one byte of Aside is requested -- and when the phone
      is offline or Telegram is unreachable, it is the full connection
      timeout with a blank screen on top of it.

      `defer` and not `async`, deliberately. Deferred classic scripts and
      module scripts execute in document order, so this still runs before
      the app and `window.Telegram` is populated by the time anything reads
      it. `async` would race that ordering for no extra benefit.
    -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
